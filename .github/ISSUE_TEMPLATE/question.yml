name: Usage question
description: Ask about running a tool, interpreting output, or integrating it into a local workflow.
body:
  - type: markdown
    attributes:
      value: >-
        Ask anything about using Orynval Labs. Do not paste real secrets,
        customer data, private repository content, or exploit details.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - mcp-drift
        - nhi-ghost
        - trust-proof
        - shared core / output
        - general
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Safe context
      description: Optional minimal, synthetic context that helps reproduce the question.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I did not include real secrets, customer data, or exploit details.
          required: true
