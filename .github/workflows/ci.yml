name: CI

# Runs the exact gates the project holds itself to: formatting, vet, tests, the
# race detector, and a coverage gate that keeps the shared core at 100.0%.
# Everything runs offline — no step reaches the network beyond fetching the
# toolchain and the module cache.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gofmt · vet · test · race · coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt (must be clean)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: Coverage (shared core must stay at 100.0%)
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          echo "total coverage: $total"
          if [ "$total" != "100.0%" ]; then
            echo "::error::coverage regressed below 100.0% (got $total)"
            exit 1
          fi

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
